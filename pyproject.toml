[project]
name = "mcmot"
version = "0.1.0"
description = "Multi-camera multi-object tracking: YOLO detection, DeepSORT per camera, ground-plane cross-camera association (WILDTRACK)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",          # YOLO person detector
    "deep-sort-realtime>=1.3.2",  # DeepSORT tracker + MobileNetV2 appearance embedder
    "motmetrics>=1.4",           # MOTA / IDF1
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcmot"]

# CUDA build of PyTorch. Remove this block to get the CPU build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
