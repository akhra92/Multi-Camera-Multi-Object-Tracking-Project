# DCASE 2024 Task 2 (sound only). Other configs inherit from this file.
dataset: dcase2024
data_root: data/dcase2024_dev      # contains <machine>/train/*.wav and <machine>/test/*.wav
cache_dir: data/cache              # cached spectrograms
output_dir: outputs                # trained models, scores, results
modality: sound                    # sound | vibration | fusion (fusion = sound + vibration)

# Features per modality (log-mel spectrograms; DCASE baseline settings for sound)
features:
  sound:
    sample_rate: 16000             # signals are resampled to this rate
    n_fft: 1024
    hop_length: 512
    n_mels: 128
    power: 2.0
    n_frames: 5                    # frames stacked into one autoencoder input vector

# Autoencoder
ae:
  hidden_dim: 128
  n_hidden_layers: 4               # per encoder/decoder
  bottleneck_dim: 8
  epochs: 100
  batch_size: 512
  lr: 0.001
  val_fraction: 0.1

# Decision threshold for normal/anomaly = this percentile of anomaly scores on training (normal) clips
threshold_percentile: 90

# pAUC uses false-positive rate range [0, max_fpr] (DCASE uses 0.1)
max_fpr: 0.1

seed: 42
