# MIMII (Hitachi): sound only, 8-channel microphone array, 16 kHz, 10 s per file.
#   python scripts/download_mimii.py --machines fan --snr 6
#   python -m msad.run --config configs/mimii.yaml
# Each machine ID (id_00, id_02, ...) is evaluated as its own machine. Other machine type or noise level:
#   --set data_root=data/mimii/-6dB/pump
inherit: folder.yaml

data_root: data/mimii/6dB/fan    # contains id_00/{normal,abnormal}/*.wav, id_02/..., ...
modality: sound

folder:
  sound_channels: [0]            # first microphone of the array
  vibration_channels: null
  test_fraction: 0.3             # MIMII has no official split: 30% of normal files are held out for testing
