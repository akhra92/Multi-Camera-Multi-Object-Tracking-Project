# IMAD-DS: microphone + accelerometer recorded together on a brushless motor and a robotic arm, with
# source/target domains. Converted to .npy + manifest by scripts/convert_imad_ds.py (all channels at 16 kHz).
#   python scripts/convert_imad_ds.py --src data/imad_ds_raw --out data/imad_ds
#   python -m msad.run --config configs/imad_ds.yaml --modality sound vibration fusion
# Reports AUC(source), AUC(target), pAUC and hmean as for DCASE, plus AUC per anomaly type.
inherit: folder.yaml

data_root: data/imad_ds
modality: fusion

folder:
  manifest: data/imad_ds/manifest.csv   # official train/test split, labels, anomaly types and domains
  sample_rate: 16000
  sound_channels: [0]                   # microphone
  vibration_channels: [1, 2, 3]         # accelerometer x/y/z; [1, 2, 3, 4, 5, 6] with gyroscope (--gyro)
  segment_seconds: null                 # one clip per segment

features:
  vibration:
    sample_rate: null                   # keep 16 kHz
    n_fft: 2048                         # ~8 Hz bins
    hop_length: 512
    n_mels: 64                          # per axis
    fmax: 3500                          # half the accelerometer's ~7 kHz rate; above that is interpolation
